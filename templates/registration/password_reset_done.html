<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم إرسال البريد | نظام CRM الاحترافي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-color: rgba(71, 85, 105, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --primary-hover: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            --accent-glow: rgba(59, 130, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            background-image:
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(17, 24, 39, 0.5) 0px, transparent 50%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
        }

        .auth-container {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 45px 40px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .auth-container:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
            transform: translateY(-2px);
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 24px;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25); }
            50% { transform: scale(1.03); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.45); }
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: var(--primary-gradient);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 15px 20px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-action:hover {
            background: var(--primary-hover);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-icon">
            <i class="fa-solid fa-paper-plane"></i>
        </div>

        <h2>تم الإرسال بنجاح</h2>
        <p>إذا كان البريد مسجلاً لدينا، فقد أرسلنا لك رابط إعادة التعيين. تفقد بريدك الوارد (وكذلك قسم الرسائل غير المرغوب فيها Spam).</p>

        <a href="{% url 'login' %}" class="btn-action">
            <i class="fa-solid fa-arrow-right"></i> العودة لتسجيل الدخول
        </a>
    </div>

</body>
</html>
